robot:
  _target_: gello.robots.ur.URRobot
  robot_ip: "192.168.1.10"
  no_gripper: false
  gripper_type: "wsg"
  wsg_port: "/dev/ttyACM0"
  wsg_max_width_mm: 110.0

agent:
  _target_: gello.agents.gello_agent.GelloAgent
  port: "/dev/serial/by-id/usb-FTDI_USB__-__Serial_Converter_FT7WBG6-if00-port0"
  dynamixel_config:
    _target_: gello.agents.gello_agent.DynamixelRobotConfig
    joint_ids: [1, 2, 3, 4, 5, 6]
    joint_offsets: [0.0, 4.71239, 1.5708, 1.5708, 0.0, 4.71239]
    joint_signs: [1, 1, -1, 1, 1, 1]
    gripper_config: [7, 20, -22]
  # Conservative UR-style startup posture (6 arm joints + normalized gripper).
  start_joints: [0.0, -1.57, 1.57, -1.57, -1.57, 0.0, 1.0]

# Conservative default for early data-collection bring-up.
hz: 30
hardware_server_port: 6001
max_steps: 1000
